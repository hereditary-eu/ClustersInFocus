[package]
name = "cif-compute"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# keep in lockstep with the wasm-bindgen-cli version in package.json and frontend/Dockerfile
wasm-bindgen = "=0.2.130"
kodama = "0.3.0"

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
lto = true
