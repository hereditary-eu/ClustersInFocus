[project]
name = "clusters-in-focus"
version = "0.1.0"
description = "Clusters in Focus: A Simple and Robust Detail-On-Demand Dashboard"
authors = [{ name = "Lukas Schilcher" }, { name = "Peter Waldert" }]
license = { text = "MIT" }
requires-python = ">=3.12"
# Python is only the reference implementation the Rust crate is tested against (reference/)
dependencies = [
  "numpy (>=2.3.0,<3.0.0)",
  "pandas (>=2.3.0,<3.0.0)",
  "scikit-learn (>=1.7.0,<2.0.0)",
  "scipy (>=1.16.0,<2.0.0)",
  "shap (>=0.54.1,<0.55.0)",
  "xgboost-cpu (>=3.0.2,<4.0.0)",
]

[dependency-groups]
dev = ["pytest (>=8.4.0,<10.0.0)"]

[tool.pytest.ini_options]
testpaths = ["reference"]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["I"]
